version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.3
    container_name: surveyor_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-surveyor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-surveyor_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surveyor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surveyor_network

  redis:
    image: redis:7-alpine
    container_name: surveyor_redis_prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surveyor_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: surveyor_backend_prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-surveyor}:${POSTGRES_PASSWORD:-change-in-production}@postgres:5432/${POSTGRES_DB:-surveyor_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      ENVIRONMENT: production
      DEBUG: "False"
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://example.com"]}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - surveyor_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: surveyor_frontend_prod
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - surveyor_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: surveyor_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - surveyor_network
    restart: unless-stopped

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local

networks:
  surveyor_network:
    driver: bridge
